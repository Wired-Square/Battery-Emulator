; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./Software

; ── Shared base ───────────────────────────────────────────────────────────────

[env]
; Board-specific drivers are opt-in: excluded here, re-included by the envs
; whose boards carry the hardware.
build_src_filter = +<*> -<src/lib/tca9538/> -<src/lib/vn9dxxxxxx/>
framework = arduino
; Regenerates the gzipped web asset table from src/devboard/webserver/web/.
extra_scripts =
    pre:scripts/gen_web_assets.py
    pre:tools/identify_build.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = default, time, log2file, esp32_exception_decoder
custom_sdkconfig = file://sdkconfig.be_size.defaults
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/network_provisioning
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-modbus
    espressif/esp_modem
    espressif/esp-sr
    espressif/esp-dsp
    espressif/qrcode
    chmorgan/esp-libhelix-mp3
    espressif/lan867x
    espressif/w5500
    espressif/dm9051
    espressif/ksz8851snl
build_flags =
    -I include
    -Wimplicit-fallthrough
    -Wextra
    -Wall
    -fno-exceptions
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

[common_esp32]
board = esp32dev
board_build.flash_mode = qio
board_build.f_flash = 80000000
board_build.arduino.memory_type = qio_qspi
board_build.partitions = min_spiffs.csv
lib_deps =
build_flags =
    ${env.build_flags}
    -Werror

[common_esp32s3]
board = esp32s3_flash_16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
upload_speed = 921600
lib_deps =
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 1 = USB port as serial
    -D ARDUINO_RUNNING_CORE=1    ; Arduino runs on core (setup, loop)
    -D ARDUINO_EVENT_RUNNING_CORE=1

; ── Environments ─────────────────────────────────────────────────────────────

[env:esp32devkit_330]
extends = common_esp32
build_flags =
    ${common_esp32.build_flags}
    -D HW_DEVKIT
    -D SMALL_FLASH_DEVICE
lib_ignore = Wire

[env:lilygo_330]
extends = common_esp32
build_flags =
    ${common_esp32.build_flags}
    -D HW_LILYGO
    -D SMALL_FLASH_DEVICE
    -D SDCARD
lib_ignore = Wire

[env:stark_330]
extends = common_esp32
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    ${common_esp32.build_flags}
    -D HW_STARK

[env:lilygo_2CAN_330]
extends = common_esp32s3
; The 2CAN's PSRAM is opi, but we set it to qspi, to give us back the use of
; GPIO35-37. Unfortunately it will fail to init (opi PSRAM doesn't work in qspi
; mode), but we're not using it anyway.
build_flags =
    ${common_esp32s3.build_flags}
    -D HW_LILYGO2CAN
    -D BOARD_HAS_PSRAM

[env:BECom_330]
extends = common_esp32s3
build_flags =
    ${common_esp32s3.build_flags}
    -D HW_BECOM
    -D BOARD_HAS_RS485_DE

[env:waveshare_330]
extends = common_esp32s3
; Waveshare ESP32-S3-RS485-CAN:
; ESP32-S3R8 = 8MB Octal/OPI PSRAM, board has 16MB Flash.
; RS485_DE_PIN is intentionally not defined as a build flag here.
; The HAL exposes GPIO21 and comm_rs485.cpp configures UART2 in RS485 half-duplex mode.
board_build.arduino.memory_type = qio_opi
; Doubles as a distinct custom_sdkconfig hash: the hybrid lib cache ignores
; memory_type and would otherwise reuse the qio_qspi S3 libs for this qio_opi env.
custom_sdkconfig = file://sdkconfig.be_size.defaults
    CONFIG_SPIRAM_MODE_OCT=y
build_flags =
    ${common_esp32s3.build_flags}
    -D HW_WAVESHARE
    -D BOARD_HAS_PSRAM
    -D BOARD_HAS_RS485_DE

[env:dfrobot_edge101_330]
extends = common_esp32
board_build.arduino.memory_type = dio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${common_esp32.build_flags}
    -D HW_DFROBOT_EDGE101
    -D SDCARD
    -D BOARD_HAS_RS485_DE

[env:wiredflexlink]
board = esp32-c6-devkitc-1
board_build.flash_mode = dio
board_build.arduino.partitions = default_8MB.csv
; The C6 core enables openthread by default; its DTLS code cannot compile
; against the size-optimised mbedTLS.
custom_sdkconfig = file://sdkconfig.be_size.defaults
    CONFIG_OPENTHREAD_ENABLED=n
; -Werror via build_src_flags, not build_flags: the C6 ESP-IDF headers do not
; compile warning-free under -Wextra, and build_flags would apply it to them.
build_src_flags = -Werror
build_flags =
    ${env.build_flags}
    -D HW_WIREDFLEXLINK
    -D BOARD_HAS_INTERFACE_TERMINATION
    -D BOARD_HAS_INTERFACE_ACTIVITY_LEDS
    -D BOARD_HAS_RS485_DE
    -D BOARD_HAS_LOAD_SWITCH
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${env.build_src_filter} +<src/lib/tca9538/> +<src/lib/vn9dxxxxxx/>
lib_deps =

